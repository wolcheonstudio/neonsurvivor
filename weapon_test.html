<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weapon Test - Neon Survivor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .test-controls {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 1000; background: rgba(0,0,0,0.8);
      padding: 15px; border-radius: 12px; border: 1px solid var(--accent-cyan);
    }
    .test-btn {
      padding: 10px 20px; font-family: 'Outfit'; font-weight: bold; cursor: pointer;
      border: 1px solid var(--accent-cyan); background: transparent; color: var(--accent-cyan);
      border-radius: 4px; transition: 0.3s;
    }
    .test-btn.active { background: var(--accent-cyan); color: #000; }
    .test-info {
      position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8);
      padding: 15px; border-radius: 8px; color: #fff; font-size: 0.9rem;
      border: 1px solid var(--accent-pink);
    }
  </style>
</head>
<body class="playing">
  <div class="test-controls">
    <button class="test-btn active" onclick="setWeapon('base', this)">기본 (1방향)</button>
    <button class="test-btn" onclick="setWeapon('2way', this)">2방향 (앞뒤)</button>
    <button class="test-btn" onclick="setWeapon('4way', this)">4방향 (십자)</button>
    <button class="test-btn" style="border-color:var(--accent-pink); color:var(--accent-pink);" onclick="spawnWave()">적 대량 소환</button>
  </div>

  <div class="test-info">
    <div>현재 무기: <span id="currentWep">기본</span></div>
    <div>데미지 배율: <span id="dmgMult">100%</span></div>
    <div style="margin-top:5px; color:var(--accent-amber);">* 테스트용: 공격력 50, 연사속도 5.0</div>
  </div>

  <div id="game-section">
    <canvas id="game"></canvas>
    <!-- HUD -->
    <div id="hud">
      <div class="hud-top">
        <div class="stat-group"><span>LV</span> <span id="levelEl">1</span></div>
        <div class="xp-bar"><div id="xpFill" class="xp-fill"></div></div>
        <div class="stat-group"><span>TIME</span> <span id="timeEl">0:00</span></div>
      </div>
      <div class="hp-container">
        <div class="hp-bar"><div id="hpFill" class="hp-fill"></div></div>
        <span id="hpText">100 / 100</span>
      </div>
    </div>
  </div>

  <!-- Audio Controls (Reused) -->
  <div id="audioControls" style="display:none;">
    <button id="bgmToggle">🎵</button>
    <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.3">
    <button id="muteBtn">🔊</button>
  </div>

  <!-- Hidden elements needed by game.js logic -->
  <div class="hidden">
    <div id="coinsEl">0</div><div id="ampCountEl">0</div>
    <div id="atkVal">10</div><div id="spdVal">280</div>
    <div id="startModal" class="hidden"></div><div id="gameoverModal" class="hidden"></div>
    <div id="levelupModal" class="hidden"></div><div id="shopModal" class="hidden"></div>
    <div id="upgradeList"></div><div id="shopList"></div><div id="weaponList"></div>
    <button id="pauseBtn"></button><button id="closeShopBtn"></button><button id="gotoShopBtn"></button>
    <button id="reviveBtn"></button><button id="restartBtn"></button>
    <button id="tabConsumables"></button><button id="tabWeapons"></button>
    <div id="worldRankTime"></div><div id="worldRankCoins"></div>
    <div id="bestTime"></div><div id="bestCoins"></div>
    <div id="currTime"></div><div id="currCoins"></div>
  </div>

  <script src="weapon_test.js"></script>
</body>
</html>
